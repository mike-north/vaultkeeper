[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mike-north/vaultkeeper"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Async
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }

# Crypto (RustCrypto ecosystem — all wasm32-compatible)
aes-gcm = "0.10"
sha2 = "0.10"
base64ct = { version = "1", features = ["alloc"] }
getrandom = "0.3"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }

# WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }

# Internal
vaultkeeper-core = { path = "crates/vaultkeeper-core", version = "0.3.0" }

# Security
zeroize = "1"

# Testing
assert_matches = "1"
serial_test = "3"

# Pinned to 1 codegen unit for the wasm build's dependency graph only (issue
# #240): with the default (16, LLVM's own parallel-codegen-unit partitioning),
# rustc/wasm-bindgen's internal per-instantiation symbol hashes (e.g.
# wasm_bindgen__closure__destroy__h<hex>) differ between hosts even given
# byte-identical source and an identical pinned toolchain — confirmed via a
# real CI run producing a different committed-artifact hash than the same
# build run locally. A single codegen unit removes that source of
# nondeterminism. Scoped to these two packages (not the whole workspace) so
# the native CLI's build isn't affected.
[profile.release.package.vaultkeeper-wasm]
codegen-units = 1

[profile.release.package.vaultkeeper-core]
codegen-units = 1
