[package]
name = "vaultkeeper-cli"
description = "Native CLI binary for vaultkeeper"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vaultkeeper"
path = "src/main.rs"

[dependencies]
vaultkeeper-core = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = { workspace = true }
serial_test = { workspace = true }
# StubTool (issue #313 AC2): spawns the real `vk-stub-secret-tool` binary
# through `NativeHostPlatform::exec`, exercising a real backend's
# argv-build/stdin-routing/stdout-parse/error-classify path end to end
# against it.
vaultkeeper-stub-tools = { path = "../vaultkeeper-stub-tools" }
