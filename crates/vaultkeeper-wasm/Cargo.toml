[package]
name = "vaultkeeper-wasm"
description = "WASM bindings for vaultkeeper — used by the npm package"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Explicit -Oz (aggressive size optimization) rather than relying on wasm-pack's
# implicit default wasm-opt invocation. wasm-opt's exact version must be pinned
# on PATH by the caller (see crates/vaultkeeper-wasm/wasm-toolchain.env and the
# CI "wasm-guards" job in .github/workflows/ci.yml) — wasm-pack otherwise falls
# back to whatever wasm-opt it finds first on PATH, which breaks byte-for-byte
# reproducibility across machines/CI.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[dependencies]
vaultkeeper-core = { path = "../vaultkeeper-core" }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
console_error_panic_hook = { workspace = true }
zeroize = { workspace = true }

# Enable JS-backed randomness for wasm32 targets
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["v4", "js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
