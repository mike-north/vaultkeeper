name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Verify committed backend conformance corpus matches a fresh export (drift check)
        # The Rust corpus in crates/vaultkeeper-conformance/src/backend_cases.rs
        # is the single source of truth; the JS conformance runner in
        # packages/test-helpers/test/conformance/backend-cases.test.ts loads a
        # committed export of it rather than regenerating it at test time (so
        # the TS package has no Cargo dependency at test time). If someone
        # edits the corpus without re-running the exporter, the committed JSON
        # silently goes stale and the TS suite stops exercising the real
        # cases. Mirrors the check:api-report regeneration-diff pattern.
        run: |
          cargo run -q -p vaultkeeper-conformance --bin export-backend-conformance \
            > /tmp/backend-cases-fresh.json
          if ! diff -u packages/test-helpers/test/conformance/backend-cases.json /tmp/backend-cases-fresh.json; then
            echo "::error::packages/test-helpers/test/conformance/backend-cases.json is stale. Regenerate it: cargo run -p vaultkeeper-conformance --bin export-backend-conformance > packages/test-helpers/test/conformance/backend-cases.json"
            exit 1
          fi

      - name: Verify committed StubTool axis corpus matches a fresh export (drift check, issue #313)
        # Same rationale/pattern as the backend-conformance drift check above,
        # for the world-mutation/state-conditional/shape-assertion corpus
        # (vaultkeeper_conformance::stub_scenario_cases()) the JS runner in
        # packages/cli-tests/test/conformance/stub-tool-axes.test.ts loads a
        # committed export of.
        run: |
          cargo run -q -p vaultkeeper-conformance --bin export-stub-scenarios \
            > /tmp/stub-scenarios-fresh.json
          if ! diff -u packages/cli-tests/test/conformance/stub-scenarios.json /tmp/stub-scenarios-fresh.json; then
            echo "::error::packages/cli-tests/test/conformance/stub-scenarios.json is stale. Regenerate it: cargo run -p vaultkeeper-conformance --bin export-stub-scenarios > packages/cli-tests/test/conformance/stub-scenarios.json"
            exit 1
          fi

      - name: Build vk-stub-* binaries
        # packages/cli-tests' StubTool axis conformance test (issue #313 AC3)
        # resolves these from target/debug at test time, the same way the
        # `vaultkeeper` binary itself is resolved by run-conformance.test.ts —
        # built here (debug profile is enough; they're never shipped) so the
        # TS job below can download and use them without a Cargo toolchain.
        run: cargo build -p vaultkeeper-stub-tools --bins

      - name: Upload vk-stub-* binaries
        uses: actions/upload-artifact@v4
        with:
          name: vk-stub-tools-binaries
          path: |
            target/debug/vk-stub-ykman
            target/debug/vk-stub-secret-tool
            target/debug/vk-stub-security
            target/debug/vk-stub-op
            target/debug/vk-stub-powershell
          retention-days: 1

      - name: Build release binary
        run: cargo build --release

      - name: Upload Rust binary
        uses: actions/upload-artifact@v4
        with:
          name: vaultkeeper-binary
          path: target/release/vaultkeeper
          retention-days: 1

  keychain-conformance:
    name: macOS Keychain Backend Conformance
    # Runs `KeychainBackend` against the real `security(1)` binary and a real
    # Keychain, via an ephemeral `create-keychain` (issue #290 AC5). The
    # `rust` job above only runs on ubuntu-latest, where this test detects
    # the missing macOS prerequisite and skips itself (see
    # crates/vaultkeeper-core/tests/keychain_conformance.rs), so it needs its
    # own macOS runner to actually execute.
    runs-on: macos-latest
    # macOS runner minutes bill at ~10x Linux minutes — cap this well below
    # the 6h default so a hung interactive `security` process (e.g. an
    # unexpected TTY prompt) can't run away with cost instead of failing
    # fast.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run keychain conformance test
        run: cargo test -p vaultkeeper-core --test keychain_conformance -- --nocapture

  wasm-guards:
    name: WASM Build Guards (drift + size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Single source of truth for the pinned Rust/wasm-pack/wasm-opt versions
      # and the size budget — shared with the local regeneration command
      # documented in packages/vaultkeeper-wasm/README.md.
      - name: Load pinned wasm toolchain versions
        # $GITHUB_ENV only accepts strict KEY=VALUE lines — comments/blank lines
        # (kept in the source file for documentation) make the env file command
        # fail outright, so filter them out before appending. Match a `#`
        # preceded by only whitespace, not just column 1, in case a comment
        # line is ever indented.
        run: grep -v '^[[:space:]]*#' crates/vaultkeeper-wasm/wasm-toolchain.env | grep -v '^[[:space:]]*$' >> "$GITHUB_ENV"

      # @master (not @stable, unlike the "rust" job above) is required here:
      # @stable doesn't honor an explicit `toolchain:` version pin the same
      # way — only @master's input handling supports pinning an exact
      # version like RUST_TOOLCHAIN_VERSION. This is intentional, not an
      # oversight; do not "fix" it to match the rust job's @stable.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned wasm-pack
        run: |
          curl -sSfL -o /tmp/wasm-pack.tar.gz \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_PACK_SHA256}  /tmp/wasm-pack.tar.gz" | sha256sum -c -
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          # Install into a guaranteed user-writable directory rather than
          # /usr/local/bin, which is not writable by the default runner user
          # on all runner images (this happened to succeed on the current
          # ubuntu-latest image, but shouldn't rely on that undocumented
          # detail persisting).
          mkdir -p "$HOME/.local/bin"
          install -m 755 "/tmp/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" "$HOME/.local/bin/wasm-pack"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/wasm-pack" --version

      - name: Install pinned wasm-opt (binaryen)
        run: |
          curl -sSfL -o /tmp/binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  /tmp/binaryen.tar.gz" | sha256sum -c -
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          echo "/tmp/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Rebuild wasm artifact with the pinned toolchain
        run: |
          # --remap-path-prefix normalizes CARGO_HOME out of embedded panic/debug
          # path strings (file!() output from registry dependencies), reducing
          # (but not eliminating — see the drift-check step below) incidental
          # differences from a local rebuild.
          export RUSTFLAGS="--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo-home"
          wasm-pack build --target nodejs crates/vaultkeeper-wasm --out-dir /tmp/wasm-rebuild

      - name: Verify committed artifact matches the pinned-toolchain rebuild (drift check)
        # AC2: byte-for-byte comparison (AC1) was tried first and demonstrably
        # does NOT hold across host platforms, even with an identical pinned
        # toolchain and the CARGO_HOME remap above. Diffing an actual CI-built
        # artifact against a local macOS rebuild of the same commit (issue
        # #240) showed the wasm module's internal type-table slot assignment,
        # data-segment string ordering, and indirect-call table differ between
        # hosts — plus wasm-bindgen's per-build closure-shim disambiguator
        # hashes (e.g. `wasm_bindgen__closure__destroy__h<16 hex>`) differ,
        # since wasm-bindgen's proc-macro always compiles for and runs on the
        # host (not the wasm32 target). None of this is an actual behavior
        # difference — confirmed by comparing the two builds' normalized
        # export/import fingerprint, which was identical.
        #
        # So the drift check instead compares that functional fingerprint —
        # the set of exports/imports (name + kind), with the known-volatile
        # closure-shim hash suffix normalized away. A real API change (added,
        # removed, or renamed export; changed import) still changes it —
        # verified locally by removing a real export and confirming the
        # comparison flags the mismatch.
        run: |
          if ! node scripts/wasm-export-fingerprint.mjs \
            packages/vaultkeeper-wasm/wasm/vaultkeeper_wasm_bg.wasm \
            /tmp/wasm-rebuild/vaultkeeper_wasm_bg.wasm; then
            echo "::error::packages/vaultkeeper-wasm/wasm/vaultkeeper_wasm_bg.wasm's export/import surface does not match a rebuild under the pinned toolchain (rustc ${RUST_TOOLCHAIN_VERSION}, wasm-pack ${WASM_PACK_VERSION}, binaryen ${BINARYEN_VERSION}). Regenerate it per packages/vaultkeeper-wasm/README.md's 'Regenerating the committed artifact' section and commit the result."
            exit 1
          fi

      - name: Upload freshly rebuilt artifact for inspection (on drift-check failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-rebuild-debug
          path: /tmp/wasm-rebuild/
          retention-days: 7
          if-no-files-found: ignore

      - name: Enforce gzip size budget
        # The committed artifact is what ships to consumers, so the budget is
        # enforced on it — not only on the fresh CI rebuild. The rebuild is
        # checked too: it is what the *next* regeneration would commit, so a
        # toolchain bump that balloons the output fails here before anyone
        # commits the result. pipefail keeps a failed `gzip -9 -c` from
        # letting `wc -c` report a bogus tiny size that silently passes.
        run: |
          set -o pipefail
          status=0
          for artifact in \
            packages/vaultkeeper-wasm/wasm/vaultkeeper_wasm_bg.wasm \
            /tmp/wasm-rebuild/vaultkeeper_wasm_bg.wasm; do
            uncompressed=$(wc -c < "$artifact")
            gzip_size=$(gzip -9 -c "$artifact" | wc -c)
            echo "${artifact}:"
            echo "  uncompressed: ${uncompressed} bytes (budget ${WASM_UNCOMPRESSED_BUDGET_BYTES})"
            echo "  gzip:         ${gzip_size} bytes (budget ${WASM_GZIP_BUDGET_BYTES})"
            if [ "$uncompressed" -gt "$WASM_UNCOMPRESSED_BUDGET_BYTES" ]; then
              echo "::error::Uncompressed wasm artifact ${artifact} (${uncompressed} bytes) exceeds budget ${WASM_UNCOMPRESSED_BUDGET_BYTES} bytes. If this growth is intentional, adjust WASM_UNCOMPRESSED_BUDGET_BYTES in crates/vaultkeeper-wasm/wasm-toolchain.env."
              status=1
            fi
            if [ "$gzip_size" -gt "$WASM_GZIP_BUDGET_BYTES" ]; then
              echo "::error::Gzipped wasm artifact ${artifact} (${gzip_size} bytes) exceeds budget ${WASM_GZIP_BUDGET_BYTES} bytes. If this growth is intentional, adjust WASM_GZIP_BUDGET_BYTES in crates/vaultkeeper-wasm/wasm-toolchain.env."
              status=1
            fi
          done
          exit $status

  typescript:
    name: TypeScript Build & Check (Node ${{ matrix.node-version }})
    needs: rust
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm check:typecheck

      - run: pnpm check:lint-ts

      - run: pnpm check:format

      - run: pnpm check:api-report

      - run: pnpm check:api-docs

      - name: Download Rust binary
        uses: actions/download-artifact@v4
        with:
          name: vaultkeeper-binary
          path: target/release

      - name: Make binary executable
        run: chmod +x target/release/vaultkeeper

      - name: Download vk-stub-* binaries
        uses: actions/download-artifact@v4
        with:
          name: vk-stub-tools-binaries
          path: target/debug

      - name: Make vk-stub-* binaries executable
        run: chmod +x target/debug/vk-stub-ykman target/debug/vk-stub-secret-tool target/debug/vk-stub-security target/debug/vk-stub-op target/debug/vk-stub-powershell

      # Standalone, non-workspace install of the pinned TypeScript compiler
      # versions used by the consumer-typecheck TS-version matrix (#125).
      # Kept out of pnpm-workspace.yaml — see that directory's package.json
      # for why — so it needs its own install step here.
      - name: Install TS-version matrix compilers
        run: pnpm --dir packages/vaultkeeper/test/e2e/ts-version-fixtures install --frozen-lockfile --ignore-workspace

      - name: Test (including conformance and TS-version matrix)
        run: pnpm test
